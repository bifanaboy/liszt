# Issue #5: a PR merged by GitHub's own automation can land on main without
# starting the "ci" workflow, so main's newest commit carries no check and
# Render (autoDeployTrigger: checksPass) never deploys it.
# GitHub does not start push workflows for merges made with its own token, but
# scheduled runs and workflow_dispatch are exempt from that rule. Every 15 minutes
# this looks at main's newest commit. If it has no "check" run and none is running,
# it starts ci on main, which reports against that exact commit.
name: ci-gap-guard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Start ci if main's newest commit has no check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name == "check")] | length')
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --json status --jq 'length')
          echo "main=$sha check_runs=$checks ci_runs=$running"
          if [ "$checks" -eq 0 ] && [ "$running" -eq 0 ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "started ci on main"
          fi
