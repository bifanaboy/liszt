# Render is set to deploy "After CI Checks Pass", and Render does NOT deploy
# when it detects zero checks - so without this workflow the service stops
# receiving deploys entirely. These checks are what `autoDeployTrigger:
# checksPass` in render.yaml waits on.
name: ci

# GitHub does not emit a `push` event for a merge performed with its own
# automation token, and `enable-auto-merge.yml` is what merges these PRs. Without
# a second path an automatic merge lands on main with ZERO checks, Render's
# `autoDeployTrigger: checksPass` never fires, and the merged commit stays
# unreleased with nothing reporting a result either way.
#
# `pull_request_target: closed` is the event GitHub still delivers for such a
# merge, so the same checks below run a second time on the merge commit itself.
# This costs a duplicate run on a human merge into main, which `push` already
# covers - the price of not having to guess who performed the merge. `main` is
# the only branch that deploys, so nothing else needs a merge-commit check.
on:
  push:
  pull_request:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# `pull_request_target` is an elevated-trust trigger: it runs with the default
# branch's workflow and a token that could write. Nothing here needs that, and
# the checked-out code is the merged commit - already reviewed, already trusted
# like a push. Say so explicitly rather than inheriting the default permissions.
permissions:
  contents: read

jobs:
  check:
    # `closed` also covers a PR that was closed without merging, and that has no
    # merge commit to check. Every other trigger passes unconditionally.
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A `pull_request_target` run is ATTACHED TO THE PULL REQUEST'S HEAD
          # COMMIT, not to the commit that reached `main`. That is measured, not
          # assumed: every `pull_request_target` run in this repository reports
          # the PR's head as its `head_sha` - PR 72's `enable` run sits on
          # 4e373eb, while the commit that actually landed was the squash
          # af6139b, which carried no check at all.
          #
          # So name the merge commit here, which fixes WHICH code is tested, and
          # read the `report` job below for what puts the result ON that commit.
          # Checking out `merge_commit_sha` on its own changes neither.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          # Render resolves `engines.node` to the newest release in the range and
          # applies security patches on every deploy. CI pins to the same major
          # so a check can never pass on a runtime the deploy will not use.
          node-version: "24"

      # WITH devDependencies. `npm ci --omit=dev` is what Render runs to build,
      # but the checks below are the devDependencies themselves.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # Check formatting of code and config, not prose. Markdown is excluded in
      # .prettierignore so docs edits cannot block tests or Render deploys.
      - run: npm run format:check

      # `npm test` alone cannot catch a glob that matched nothing: the runner
      # reports "tests 0" and exits 0. TAP's plan line is what makes that
      # checkable, so the suite runs through the tap reporter and the plan is
      # asserted to be non-empty.
      #
      # THERE IS DELIBERATELY NO `| tee` HERE. A pipeline's exit status is that
      # of its LAST command, and with `shell` unspecified the Actions runner
      # invokes `bash -e {0}` - WITHOUT `-o pipefail`. That option is added only
      # when `shell: bash` is named explicitly; GitHub's own docs note the two
      # run "a different command". So `node --test | tee` would exit 0 on a
      # FAILING suite, `set -e` would never fire, the plan line is printed on
      # failure as well as success, and a red suite would deploy green - which
      # is the one outcome this check exists to prevent.
      #
      # Redirecting to a file creates no pipeline, so `$?` is node's own exit
      # code under any shell the runner might pick. `|| status=$?` stops `set -e`
      # from aborting before the diagnostics below get to print.
      - name: test
        run: |
          status=0
          node --test --test-reporter=tap 'test/**/*.test.ts' > test-output.tap || status=$?
          cat test-output.tap
          if [ "$status" -ne 0 ]; then
            echo "::error::the test suite failed (exit $status)"
            exit "$status"
          fi
          grep -qE '^1\.\.[1-9]' test-output.tap || {
            echo '::error::the test glob matched no files - the suite did not run'
            exit 1
          }

  # The `check` job above is attached to the pull request's head commit, and no
  # `push` event arrives for a merge made with GitHub's own automation token.
  # Left there, the commit that reached `main` still carries no check at all and
  # Render still does not deploy it - which is the whole of issue #5, and is
  # exactly the state PR 72's squash commit af6139b is in today.
  #
  # So this job writes that run's conclusion onto the merge commit through the
  # Checks API. It is the same run's own result, not a second opinion or a
  # re-run: `needs.check.result` IS that job's conclusion, and the mapping below
  # is one to one. No step is skipped and no verdict is invented.
  #
  # Every failure mode here leaves the commit WITHOUT a green check, which is the
  # direction that must never deploy: if the run is cancelled before this job
  # starts, or the API call below fails, nothing is written and Render waits.
  report:
    needs: check
    # `always()`, so a RED run reports red on the merge commit. Without it a
    # failure would skip this job and leave the commit with zero checks, which
    # reads as "nothing to deploy" instead of "this failed". A pull request
    # closed without merging leaves `check` skipped and has no merge commit to
    # report on, so that case is excluded rather than reported as a failure.
    if: ${{ always() && github.event_name == 'pull_request_target' && github.event.pull_request.merged && needs.check.result != 'skipped' }}
    # Job-level permissions REPLACE the workflow's, so this narrows to writing
    # one check run and nothing else. No repository contents are read or written
    # from the pull request's context.
    permissions:
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Report the result on the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RESULT: ${{ needs.check.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$RESULT" in
            success) conclusion=success ;;
            cancelled) conclusion=cancelled ;;
            skipped)
              # No run means no result, and inventing one here would be exactly
              # the failure this job exists to prevent. The `if` above already
              # excludes it; refusing here as well keeps the two from drifting.
              echo "check was skipped - there is no result to report on $MERGE_SHA"
              exit 0
              ;;
            *) conclusion=failure ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=check \
            -f head_sha="$MERGE_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=ci on the merge commit" \
            -f "output[summary]=Run ${GITHUB_RUN_ID} of ci for pull request #${PR_NUMBER}, the same run whose head is the pull request commit, reporting ${conclusion} on the merge commit it tested. Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
