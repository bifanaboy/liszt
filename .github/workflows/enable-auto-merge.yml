name: Enable auto-merge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0] }}
    runs-on: ubuntu-latest
    steps:
      # Runs after ci passes. Never checks out PR code, so safe with write perms.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ github.event.workflow_run.pull_requests[0].node_id }}
        run: |
          gh api graphql \
            -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number autoMergeRequest { enabledAt } } } }' \
            -f id="$PR_ID"
