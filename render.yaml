# Render is the ONLY supported deployment. The VPS + Cloudflare Tunnel setup is
# gone, along with the Dockerfile that contradicted this file.
#
# The app binds 127.0.0.1 by default because that was right for a tunnel. Render
# fronts the service with its own proxy and needs a routable interface, so
# LISZT_LISTEN_ADDR is overridden here and ONLY because of that. Do not copy this
# to a box you own.
#
# There is nothing to type into the dashboard: every value below is in this file,
# and there is no secret. The service is public by design.
services:
  - type: web
    name: liszt
    runtime: node
    # A persistent disk requires a PAID plan. `starter` was the legacy
    # instance-type ID; `0.5c-512mb` is the current 0.5 CPU / 512 MB plan, and
    # the one this service is already provisioned on.
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node src/app.ts
    # `/health` answers a constant `{"status":"ok"}` before anything touches the
    # store. It must NOT be `/api/health`: that one is stateful, and Render
    # treats anything but 2xx as a failed deploy.
    healthCheckPath: /health
    # `checksPass`, not the deprecated `autoDeploy`. The dashboard is already set
    # to "After CI Checks Pass", and without this key a blueprint sync keeps
    # whatever the dashboard happens to say while a NEW service defaults to
    # `commit` - which would deploy straight from main with no checks at all.
    autoDeployTrigger: checksPass
    # Render's default is 30s, and this app needs longer. The scheduler waits up
    # to 30s for an in-flight cycle; `SHUTDOWN_BACKSTOP_MS` in src/app.ts then
    # forces the exit at 45s. Against the 30s default that overruns and the
    # platform SIGKILLs the process mid-write to the SQLite file on the attached
    # disk, on every single deploy. 60s leaves 15s of headroom over the worst
    # case the app can actually reach.
    maxShutdownDelaySeconds: 60
    disk:
      name: liszt-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Nothing here reads NODE_ENV any more - the auth gate that needed it is
      # deleted. npm reads it, which is reason enough to set it.
      - key: NODE_ENV
        value: production
      # PORT is deliberately absent: Render injects it (10000 by default) and
      # `loadConfig` already reads it. Pinning it here is a stale constant.
      - key: LISZT_DB_PATH
        value: /data/liszt.db
      - key: LISZT_LISTEN_ADDR
        value: 0.0.0.0
      - key: LISZT_POLL_INTERVAL_MINUTES
        value: "30"
      - key: LISZT_EPORNER_LQ
        value: "0"
      - key: LISZT_TRUSTED_UPLOADERS
        value: Vovick17,KJUIUI,Rafael12021988,wmrt0s
      # The Node version is NOT pinned here. A `NODE_VERSION` of "24.0.0" holds
      # the service on the first 24.x patch and never receives 24.x security
      # updates. `engines.node` in package.json carries the range instead, which
      # Render resolves to the newest release inside it.